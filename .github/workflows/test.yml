name: Test

# Vets and tests every package on Linux under a virtual display, and Apple's shared platform code on macOS. Until the first release it runs only when dispatched (AGENTS.md); restore the push and pull_request triggers as part of releasing. release.yml calls it before publishing a release.
on:
  # push:
  #   branches:
  #     - main
  # pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install GTK 4, HTTP transport and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libsoup-3.0-0 xvfb
      - name: Download the module graph for offline template tests
        run: go mod download all
      - name: Vet
        run: go tool nsgo check
      - name: Test instance isolation and file handoff
        run: go tool nsgo test -run '^TestInstance' ./internal/platform/linux
      - name: Test
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a go tool nsgo test

  apple:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go tool nsgo check ./internal/platform/apple
      - name: Test
        run: go tool nsgo test ./internal/platform/apple

  windows-instance:
    name: Windows instance handoff
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test instance isolation and file handoff
        run: go tool nsgo test -run '^TestInstance' ./internal/platform/windows

  linux-associations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install desktop registration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils shared-mime-info libglib2.0-bin
      - name: Check
        run: go tool nsgo check ./cmd/nsgo
      - name: Verify packages and GIO registration
        env:
          NSGO_FILE_ASSOCIATIONS: '1'
        run: go tool nsgo test -run 'FileAssociations|FileTypes|NSIS|LinuxPackages|FlatpakManifest|AppDirEntries' ./cmd/nsgo

  windows-associations:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Check
        run: go tool nsgo check ./cmd/nsgo
      - name: Verify install, Shell opening, upgrade and uninstall
        env:
          NSGO_FILE_ASSOCIATIONS: '1'
        run: go tool nsgo test -run 'FileAssociations|FileTypes|NSIS|LinuxPackages|FlatpakManifest|AppDirEntries' ./cmd/nsgo
